[defaults]
remote_user = root
forks = 20
interpreter_python = /usr/bin/python3
host_key_checking = False
display_skipped_hosts = no
callbacks_enabled = profile_tasks

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o GSSAPIAuthentication=no -o StrictHostKeyChecking=no
