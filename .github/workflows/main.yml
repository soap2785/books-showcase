name: CI/CD Pipeline

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ staging ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      LIMIT_TARGET: ${{ github.ref_name == 'main' && 'api_prod' || 'api_test' }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare System
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: system.yml
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          options: |
            --inventory inventory.ini
            --limit ${{ env.LIMIT_TARGET }}
        env:
          ANSIBLE_CONFIG: ansible.cfg

      - name: Create Certificates
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: certificates.yml
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          options: |
            --inventory inventory.ini
            --limit ${{ env.LIMIT_TARGET }}
        env:
          ANSIBLE_CONFIG: ansible.cfg

      - name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV

      - name: Setup Service
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: setup.yml
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          options: |
            --inventory inventory.ini
            --limit ${{ env.LIMIT_TARGET }}
            -e "BACKEND_IMAGE=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}"
            -e "FRONTEND_IMAGE=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}"
            -e "ENV_FILE={{ secrets.ENV_FILE }}"
        env:
          ANSIBLE_CONFIG: ansible.cfg
          CURRENT_BRANCH: ${{ env.BRANCH_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Manage Migrations
        uses: dawidd6/action-ansible-playbook@v2
        with:
          playbook: migrations.yml
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          options: |
            --inventory inventory.ini
            --limit ${{ env.LIMIT_TARGET }}
        env:
          ANSIBLE_CONFIG: ansible.cfg
